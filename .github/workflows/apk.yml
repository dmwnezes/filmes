name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../filmes.apk
      # O site é carregado da web, então o APK só precisa ser reinstalado quando o app Android mudar.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Filmes 1.0.${{ github.run_number }}
          body: Baixe o filmes.apk e instale no celular.
          files: filmes.apk
          make_latest: true
