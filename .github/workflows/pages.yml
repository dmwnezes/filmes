name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar config.js a partir do secret
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          printf 'window.CONFIG = { TMDB_KEY: "%s" };\n' "$TMDB_KEY" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
